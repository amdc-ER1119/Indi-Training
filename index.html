<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Knie-Training</title>
<style>
:root{--bg:#f2f6f7;--card:#fff;--ink:#14262b;--mute:#5d7378;--line:#d5e0e3;--acc:#0b7a75;--accink:#fff;--warn:#b4472f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--card:#182629;--ink:#e6f0f1;--mute:#93aaae;--line:#2b3f43;--acc:#3cc4b9;--accink:#06201e;--warn:#f08a6e}}
:root[data-theme="dark"]{--bg:#0f1a1d;--card:#182629;--ink:#e6f0f1;--mute:#93aaae;--line:#2b3f43;--acc:#3cc4b9;--accink:#06201e;--warn:#f08a6e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:110px}
main{max-width:560px;margin:0 auto;padding:12px 14px}
h1{font-size:22px;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:18px;margin:0}
.meta{color:var(--mute);font-size:14px;margin:2px 0 10px}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--acc);font:700 16px inherit}
.set.d{background:var(--acc);color:var(--accink)}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);font:inherit;font-weight:600}
.btn.fill{background:var(--acc);color:var(--accink)}
.btn.del{border-color:var(--warn);color:var(--warn)}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--acc)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>div{flex:1}
.chips{display:flex;gap:6px}.chips button{flex:1;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.chips button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.hist{font-size:15px;display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:var(--accink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;justify-content:space-between}
#timer b{font-size:30px;font-variant-numeric:tabular-nums}
#timer button{background:transparent;border:1px solid var(--accink);color:var(--accink);border-radius:10px;padding:8px 14px;font:inherit}
button{cursor:pointer}
#g{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);overflow:auto}
.gi{width:100%;max-width:520px;text-align:center}.seg{display:flex;gap:6px;margin:22px 0 6px}.seg span{flex:1;height:6px;background:var(--line);border-radius:3px}.seg span i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px}.seg span.cur{outline:1px solid var(--acc);outline-offset:3px}
.gl{font-size:44px;font-weight:700;color:var(--acc);margin:10px 0}
.gc{font-size:96px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bar{height:8px;background:var(--line);border-radius:4px;margin:18px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
</style>
</head>
<body>
<main>
<h1>Knie-Training</h1>
<p class="sub" id="date"></p>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<div id="timer"><div><div id="tl"></div><b id="tt">0:00</b></div><button onclick="stopT()">Stopp</button></div>
<script>
const K='knie-training-v1';
const DEF=()=>[
 {id:'a',name:'Kniebeugen (flach, bis ca. 60°)',sets:3,reps:12,hold:0,rest:60,t1:3,t2:1,t3:2,l1:'Runter',l2:'Hoch'},
 {id:'b',name:'Einbeinstand (pro Seite)',sets:3,reps:1,hold:30,rest:30,t1:2,t2:0,t3:2,l1:'Hoch',l2:'Runter'},
 {id:'c',name:'Zehenspitzenstand',sets:3,reps:12,hold:0,rest:45,t1:3,t2:1,t3:3,l1:'Hoch',l2:'Runter'},
 {id:'d',name:'Fersenstand',sets:3,reps:12,hold:0,rest:45,t1:3,t2:1,t3:3,l1:'Hoch',l2:'Runter'},
 {id:'e',name:'Brücke',sets:3,reps:10,hold:0,rest:45,t1:2,t2:2,t3:3,l1:'Hoch',l2:'Runter'}];
let S=null;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.ex)S={ex:DEF(),log:{}};
let tab='heute';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toLocaleDateString('sv');
const L=d=>S.log[d]||(S.log[d]={done:{},pain:'',swell:'',note:''});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=(v,d)=>{v=parseInt(v,10);return isNaN(v)||v<0?d:v};
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

let T=null,ac=null;
function beep(v=.3){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.value=v;o.start();o.stop(ac.currentTime+.5)}catch(e){}
 try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
function startT(sec,label){stopT();unlockAudio();
 T={end:Date.now()+sec*1000,h:setInterval(tick,250)};
 document.getElementById('tl').textContent=label;document.getElementById('timer').style.display='flex';tick()}
function tick(){const r=Math.ceil((T.end-Date.now())/1000);
 if(r<=0){beep();stopT();return}document.getElementById('tt').textContent=fmt(r)}
function stopT(){if(T){clearInterval(T.h);T=null}document.getElementById('timer').style.display='none'}

function tapSet(id,i){const l=L(today()),ex=S.ex.find(e=>e.id===id),n=l.done[id]||0;
 if(i<n){mark(ex,i)}else{mark(ex,i+1);if(ex.rest>0&&i+1<ex.sets)startT(ex.rest,'Pause')}
 save();render()}
function hold(id){const ex=S.ex.find(e=>e.id===id);startT(ex.hold,'Halten: '+ex.name)}
function setF(f,v){const l=L(today());l[f]=v;save();if(f!=='note')render()}

function render(){
 document.getElementById('date').textContent=new Date().toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
 document.getElementById('nav').innerHTML=[['heute','Heute'],['ex','Übungen'],['hist','Verlauf']].map(([k,t])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${t}</button>`).join('');
 const v=document.getElementById('view');
 if(tab==='heute')v.innerHTML=viewToday();else if(tab==='ex')v.innerHTML=viewEx();else v.innerHTML=viewHist();
}
function viewToday(){const l=L(today());
 if(!S.ex.length)return '<div class="card">Noch keine Übungen. Lege sie unter „Übungen“ an.</div>';
 let h=`<button class="btn fill" style="width:100%;margin-bottom:12px;padding:14px" onclick="startG()">Gesamtdurchlauf starten (ca. ${estMin()} min)</button>`+S.ex.map((e,xi)=>{const n=l.done[e.id]||0;
  const meta=e.hold>0?`${e.sets} × ${e.hold} s halten`:`${e.sets} × ${e.reps} Wiederholungen`;
  let s='';for(let i=0;i<e.sets;i++)s+=`<button class="set ${i<n?'d':''}" onclick="tapSet('${e.id}',${i})" aria-label="Satz ${i+1}">${i+1}</button>`;
  return `<div class="card"><h2>${esc(e.name)}</h2><p class="meta">${meta}${e.rest?`, Pause ${e.rest} s`:''}</p><div class="sets">${s}</div><button class="btn fill" onclick="startG(${xi})">Übung starten</button></div>`}).join('');
 h+=`<div class="card"><h2>Wie war es heute?</h2>
 <label>Schmerz (0 = keiner, 10 = stark)</label><select onchange="setF('pain',this.value)"><option value="">–</option>${[...Array(11).keys()].map(i=>`<option ${l.pain===String(i)?'selected':''}>${i}</option>`).join('')}</select>
 <label>Schwellung</label><div class="chips">${['keine','leicht','deutlich'].map(x=>`<button class="${l.swell===x?'on':''}" onclick="setF('swell','${x}')">${x}</button>`).join('')}</div>
 <label>Notiz</label><textarea rows="2" oninput="setF('note',this.value)">${esc(l.note)}</textarea></div>`;
 return h}
function viewEx(){
 let h=S.ex.map(e=>`<div class="card"><label>Name</label><input value="${esc(e.name)}" onchange="upd('${e.id}','name',this.value)">
 <div class="row"><div><label>Sätze</label><input type="number" inputmode="numeric" min="1" value="${e.sets}" onchange="upd('${e.id}','sets',this.value)"></div>
 <div><label>Wiederholungen</label><input type="number" inputmode="numeric" min="1" value="${e.reps}" onchange="upd('${e.id}','reps',this.value)"></div></div>
 <div class="row"><div><label>Halten (s, 0 = aus)</label><input type="number" inputmode="numeric" min="0" value="${e.hold}" onchange="upd('${e.id}','hold',this.value)"></div>
 <div><label>Pause (s)</label><input type="number" inputmode="numeric" min="0" value="${e.rest}" onchange="upd('${e.id}','rest',this.value)"></div></div>
 <label>Tempo in Sekunden: Phase 1, Halten, Phase 2</label><div class="row"><div><input type="number" inputmode="numeric" min="0" value="${e.t1??2}" onchange="upd('${e.id}','t1',this.value)"></div><div><input type="number" inputmode="numeric" min="0" value="${e.t2??0}" onchange="upd('${e.id}','t2',this.value)"></div><div><input type="number" inputmode="numeric" min="0" value="${e.t3??2}" onchange="upd('${e.id}','t3',this.value)"></div></div>
 <div class="row"><div><label>Name Phase 1</label><input value="${esc(e.l1||'Hoch')}" onchange="upd('${e.id}','l1',this.value)"></div><div><label>Name Phase 2</label><input value="${esc(e.l2||'Runter')}" onchange="upd('${e.id}','l2',this.value)"></div></div>
 <label>Ton im Durchlauf</label><select onchange="upd('${e.id}','snd',this.value);render()">${[['click','Klick'],['wood','Holzklopfer'],['soft','Weicher Ton'],['file','Eigene Datei (bei jedem Klick)'],['music','Eigene Musik (läuft durch)'],['none','Ganz stumm']].map(([k,t])=>`<option value="${k}" ${(e.snd||'click')===k?'selected':''}>${t}</option>`).join('')}</select>
 <label>Lautstärke</label><input type="range" min="0" max="100" value="${e.vol??40}" oninput="upd('${e.id}','vol',this.value)">
 ${(e.snd==='file'||e.snd==='music')?`<label>Audiodatei${e.fname?': '+esc(e.fname):' (noch keine gewählt)'}</label><input type="file" accept="audio/*" onchange="upFile('${e.id}',this)">`:''}
 <p><button class="btn" onclick="testSnd('${e.id}')">Ton testen</button> <button class="btn del" onclick="delEx('${e.id}')">Löschen</button></p></div>`).join('');
 h+=`<p><button class="btn fill" onclick="addEx()">Übung hinzufügen</button> <button class="btn" onclick="resetEx()">Standardübungen laden</button></p>`;
 return h}
function upd(id,f,val){const e=S.ex.find(x=>x.id===id);
 e[f]=(f==='name'||f==='l1'||f==='l2'||f==='snd')?val:num(val,f==='sets'?3:0);if(f==='sets'&&e.sets<1)e.sets=1;save()}
function addEx(){S.ex.push({id:'x'+Date.now(),name:'Neue Übung',sets:3,reps:10,hold:0,rest:45,t1:2,t2:1,t3:2,l1:'Hoch',l2:'Runter'});save();render()}
function delEx(id){if(confirm('Übung löschen?')){S.ex=S.ex.filter(e=>e.id!==id);fdel(id);save();render()}}
function resetEx(){if(confirm('Deine Übungsliste durch die Standardübungen ersetzen?')){S.ex=DEF();save();render()}}
function viewHist(){
 const days=Object.keys(S.log).sort().reverse().slice(0,21);
 if(!days.length)return '<div class="card">Noch keine Einträge. Hake Sätze unter „Heute“ ab.</div>';
 return days.map(d=>{const l=S.log[d],sn=l.snap||{};
  const rows=Object.keys(l.done).filter(id=>l.done[id]>0).map(id=>{const c=sn[id]||S.ex.find(e=>e.id===id);if(!c)return '';
   return `<div class="hist"><span>${esc(c.name)}</span><span>${l.done[id]}/${c.sets} Sätze · ${c.hold>0?c.hold+' s':c.reps+' Wdh.'}</span></div>`}).join('');
  const info=[l.pain!==''?'Schmerz '+l.pain:'',l.swell?'Schwellung '+l.swell:'',l.note||''].filter(Boolean).map(esc).join(' · ');
  return `<div class="card"><h2>${new Date(d+'T12:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</h2><p class="meta">${info||'Keine Angaben zu Schmerz oder Schwellung'}</p>${rows||'<div class="meta">Keine Übung eingetragen</div>'}</div>`}).join('')}

const tp=e=>[e.t1??2,e.t2??0,e.t3??2];
let G=null,wl=null;
function mark(e,n){const l=L(today());l.done[e.id]=n;l.snap=l.snap||{};l.snap[e.id]={name:e.name,sets:e.sets,reps:e.reps,hold:e.hold};save()}
function buildSteps(only){
 const st=[],add=o=>{if(o.d>0||o.k==='wait')st.push(o)};
 const xs=only==null?S.ex.map((_,i)=>i):[only];
 xs.forEach((xi,n)=>{const e=S.ex[xi];
  if(n>0)add({k:'wait',d:0,xi,label:'Nächste Übung'});
  add({k:'prep',d:3,xi,label:'Bereit'});
  for(let s=0;s<e.sets;s++){
   if(e.hold>0)add({k:'hold',d:e.hold,xi,s,q:1,label:'Halten'});
   else{let t=tp(e);if(!(t[0]+t[1]+t[2]))t=[2,0,2];
    for(let r=0;r<e.reps;r++){add({k:'p',d:t[0],xi,s,r,q:0,label:e.l1||'Hoch'});add({k:'p',d:t[1],xi,s,r,q:1,label:'Halten'});add({k:'p',d:t[2],xi,s,r,q:2,label:e.l2||'Runter'})}}
   st[st.length-1].end=true;
   if(s<e.sets-1&&e.rest>0)add({k:'rest',d:e.rest,xi,s,label:'Pause',next:'Als Nächstes: Satz '+(s+2)});
  }});
 return st}
const estMin=()=>Math.max(1,Math.round(buildSteps().reduce((a,s)=>a+s.d,0)/60));
const P={click:{f:[1500,700,1100],t:1000,type:'sine',d:.06,td:.03},wood:{f:[900,500,700],t:600,type:'triangle',d:.1,td:.05},soft:{f:[660,392,523],t:440,type:'sine',d:.25,td:.12}};
let sil=null;
function unlockAudio(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume()}catch(e){}
 try{if(!sil){sil=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=');sil.loop=true}sil.play().catch(()=>{})}catch(e){}}
function tone(f,type,v,d){try{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(Math.max(v,.0002),ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function play(buf,v){try{const o=ac.createBufferSource(),g=ac.createGain();o.buffer=buf;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start()}catch(e){}}
function cue(e,acc,q){const m=e.snd||'click',v=(e.vol??40)/100;
 if(m==='none'||m==='music')return;
 if(m==='file'){const b=G&&G.bufs[e.id];if(b)play(b,acc?v:v*.5);return}
 const p=P[m]||P.click;
 if(acc)tone(p.f[q],p.type,.5*v,p.d);else tone(p.t,p.type,.25*v,p.td)}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('knie-sounds',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fput(id,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(v,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function fget(id){const d=await idb();return new Promise((res,rej)=>{const r=d.transaction('f').objectStore('f').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fdel(id){try{const d=await idb();d.transaction('f','readwrite').objectStore('f').delete(id)}catch(e){}}
async function upFile(id,inp){const f=inp.files[0];if(!f)return;
 if(f.size>40*1024*1024){alert('Die Datei ist zu groß (max. 40 MB).');return}
 try{await fput(id,{blob:f,name:f.name});S.ex.find(e=>e.id===id).fname=f.name;save();render()}
 catch(e){alert('Die Datei konnte nicht gespeichert werden (evtl. privater Modus im Browser).')}}
async function testSnd(id){unlockAudio();const e=S.ex.find(x=>x.id===id),m=e.snd||'click',v=(e.vol??40)/100;
 if(m==='none')return;
 if(P[m]||m==='click'){cue(e,false,0);setTimeout(()=>cue(e,true,0),350);setTimeout(()=>cue(e,true,1),700);setTimeout(()=>cue(e,true,2),1050);return}
 const r=await fget(id).catch(()=>null);if(!r){alert('Noch keine Datei gewählt.');return}
 try{if(m==='file')play(await ac.decodeAudioData(await r.blob.arrayBuffer()),v);
  else{const a=new Audio(URL.createObjectURL(r.blob));a.volume=v;a.play();setTimeout(()=>a.pause(),4000)}}
 catch(x){alert('Die Datei konnte nicht abgespielt werden.')}}
async function loadFiles(xs){const bufs={},urls={};
 for(const x of xs){const e=S.ex[x];if(e.snd!=='file'&&e.snd!=='music')continue;
  const r=await fget(e.id).catch(()=>null);if(!r)continue;
  if(e.snd==='music')urls[e.id]=URL.createObjectURL(r.blob);
  else try{bufs[e.id]=await ac.decodeAudioData(await r.blob.arrayBuffer())}catch(err){}}
 return{bufs,urls}}
function stopMusic(){if(G&&G.mus){G.mus.pause();G.mus=null;G.musId=null}}
function musicSync(){if(!G)return;const s=G.st[G.i],e=S.ex[s.xi];
 if(e.snd==='music'&&G.urls[e.id]&&!G.pz&&s.k!=='wait'&&!G.fin){
  if(!G.mus||G.musId!==e.id){stopMusic();G.mus=new Audio(G.urls[e.id]);G.mus.loop=true;G.musId=e.id}
  G.mus.volume=(e.vol??40)/100;G.mus.play().catch(()=>{})}
 else if(G.mus)G.mus.pause()}
async function startG(only){if(!S.ex.length)return;stopT();unlockAudio();
 const xs=only==null?S.ex.map((_,i)=>i):[only];
 const f=await loadFiles(xs);
 G={st:buildSteps(only),xs,i:0,t0:performance.now(),last:-1,pz:false,pe:0,bufs:f.bufs,urls:f.urls,mus:null,musId:null,fin:false};
 try{navigator.wakeLock.request('screen').then(x=>{wl=x}).catch(()=>{})}catch(e){}
 const d=document.createElement('div');d.id='g';
 d.innerHTML=`<div class="gi"><div id="gx" class="meta"></div><h2 id="gn"></h2><div id="gl" class="gl"></div><div id="gseg" class="seg">${xs.map(()=>'<span><i></i></span>').join('')}</div><div id="gs" class="meta"></div><button id="gw" class="btn fill" style="width:100%;margin-top:16px;padding:14px;display:none" onclick="gNext()">Übung starten</button><div class="row" style="margin-top:18px"><div><button class="btn" style="width:100%" id="gp" onclick="gPause()">Pause</button></div><div><button class="btn" style="width:100%" onclick="gSkip()">Übung überspringen</button></div></div><p><button class="btn del" style="width:100%" onclick="gEnd()">Beenden</button></p></div>`;
 document.body.appendChild(d);G.h=setInterval(gtick,100);drawG()}
function drawG(){const s=G.st[G.i],e=S.ex[s.xi],q=id=>document.getElementById(id),w=s.k==='wait';
 q('gn').textContent=e.name;
 q('gx').textContent=`Übung ${G.xs.indexOf(s.xi)+1}/${G.xs.length}`+(s.s!==undefined?` · Satz ${s.s+1}/${e.sets}`+(s.k==='rest'?' geschafft':(s.r!==undefined?` · Wdh. ${s.r+1}/${e.reps}`:'')):'');
 q('gl').textContent=s.label;q('gs').textContent=s.next||'';
 q('gw').style.display=w?'block':'none';q('gp').style.visibility=w?'hidden':'visible';
 G.xs.forEach((x,n)=>{const all=G.st.filter(t=>t.xi===x&&(t.k==='p'||t.k==='hold')),dn=all.filter(t=>G.st.indexOf(t)<G.i).length,sp=q('gseg').children[n];
  sp.firstChild.style.width=(all.length?dn/all.length*100:0)+'%';sp.className=x===s.xi?'cur':''});
 musicSync()}
function gtick(){if(!G||G.pz)return;const s=G.st[G.i];if(s.k==='wait')return;
 const e=S.ex[s.xi],el=(performance.now()-G.t0)/1000,sec=Math.floor(el);
 if(el>=s.d){gNext();return}
 if(sec!==G.last){G.last=sec;const left=s.d-sec;
  if(sec===0&&(s.k==='p'||s.k==='hold'))cue(e,true,s.q);
  else if(s.k==='p'||left<=3)cue(e,false,0)}}
function gNext(){const s=G.st[G.i],e=S.ex[s.xi],loud=(e.snd||'click')!=='none';
 if(s.end){mark(e,Math.max(L(today()).done[e.id]||0,s.s+1));if(loud)beep(.6*(e.vol??40)/100)}
 else if(s.k==='rest'&&loud)beep(.6*(e.vol??40)/100);
 G.i++;if(G.i>=G.st.length){gDone();return}
 G.t0=performance.now();G.last=-1;drawG()}
function gSkip(){const c=G.st[G.i].xi;let j=G.i+1;while(j<G.st.length&&G.st[j].xi<=c)j++;
 if(j>=G.st.length){gDone();return}
 G.i=j;G.t0=performance.now();G.last=-1;G.pz=false;document.getElementById('gp').textContent='Pause';drawG()}
function gPause(){const b=document.getElementById('gp');
 if(!G.pz){G.pz=true;G.pe=(performance.now()-G.t0)/1000;b.textContent='Weiter'}
 else{G.t0=performance.now()-G.pe*1000;G.pz=false;b.textContent='Pause'}
 musicSync()}
function gDone(){clearInterval(G.h);G.fin=true;stopMusic();if(S.ex.some(x=>(x.snd||'click')!=='none'))beep(.25);document.querySelector('#g .gi').innerHTML='<h2>Geschafft</h2><p class="meta">Die Sätze sind im Verlauf eingetragen.</p><button class="btn fill" style="width:100%" onclick="gEnd()">Schließen</button>'}
function gEnd(){if(G){clearInterval(G.h);stopMusic();Object.values(G.urls).forEach(u=>URL.revokeObjectURL(u));G=null}const d=document.getElementById('g');if(d)d.remove();try{wl&&wl.release()}catch(e){}render()}
render();
</script>
